# Serverless Devs (s) config for the TripCascade Disruption Watcher.
# Deployed to Alibaba Cloud Function Compute (Python 3.10 runtime).
#
# FC does NOT allow HTTP + Timer triggers on the same function, so the Watcher
# deploys as TWO functions under ONE service (both share the same code package):
#   - watcher-poll : Timer trigger (P0 scheduled forecast-poll)
#   - watcher-http : HTTP trigger (GET /health + POST /webhook ingest)
#
# Pre-deploy steps (Mike):
#   1. s config add (AccountID + AccessKeyID + AccessKeySecret) — already done
#   2. bash deploy/fc_watcher/build_package.sh
#   3. s deploy -t deploy/fc_watcher/s.yaml
#
# Post-deploy:
#   - set env vars in FC console for BOTH functions (ATLAS_SANDBOX_*, AGENT_ENDPOINT_URL)
#   - verify: curl <watcher-http-url>/health  -> 200
#   - register the watcher-http URL with Atlas updateWebhookURL.do (P1 webhook stretch)

edition: 1.0.0
name: tripcascade-watcher
access: default

vars:
  region: ap-southeast-1
  service:
    name: tripcascade-watcher
    description: TripCascade Disruption Watcher — scheduled forecast-poll + Atlas webhook ingest

services:
  # ── P0: scheduled forecast-poll (Timer trigger) ──
  watcher-poll:
    component: fc
    props:
      region: ${vars.region}
      service: ${vars.service}
      function:
        name: watcher-poll
        runtime: python3.10
        handler: tripcascade.watcher.fc_function.handler
        codeUri: ./
        memorySize: 512
        timeout: 120
        environmentVariables:
          WATCHER_DEMO_MODE: "1"
          AGENT_ENDPOINT_URL: "https://agent-tripcasde-agent-cvhaldalmf.ap-southeast-1.fcapp.run" # FILL IN: agent HTTP service URL
          ATLAS_SANDBOX_BASE_URL: "https://sandbox.atriptech.com"
          # Secrets: set in console (never committed). See doc/deploy_watcher.md §2.
          # ATLAS_SANDBOX_ACCESS_KEY: ""
          # ATLAS_SANDBOX_SECRET_KEY: ""
      triggers:
        - name: timer-scheduled-poll
          type: timer
          qualifier: LATEST
          config:
            cronExpression: "0 */15 * * * *"   # every 15 min (demo; adjust for production)
            enable: true

  # ── health check + Atlas webhook ingest (HTTP trigger) ──
  watcher-http:
    component: fc
    props:
      region: ${vars.region}
      service: ${vars.service}
      function:
        name: watcher-http
        runtime: python3.10
        handler: tripcascade.watcher.fc_function.http_event_handler
        codeUri: ./
        memorySize: 512
        timeout: 60
        environmentVariables:
          WATCHER_DEMO_MODE: "1"
          AGENT_ENDPOINT_URL: "https://agent-tripcasde-agent-cvhaldalmf.ap-southeast-1.fcapp.run" # FILL IN: agent HTTP service URL
          ATLAS_SANDBOX_BASE_URL: "https://sandbox.atriptech.com"
          # ATLAS_SANDBOX_ACCESS_KEY: ""
          # ATLAS_SANDBOX_SECRET_KEY: ""
      triggers:
        - name: http-trigger
          type: http
          qualifier: LATEST
          config:
            methods: ["GET", "POST"]
            authType: anonymous
            disableURLInternet: false
      # Custom domain / HTTPS: the HTTP trigger's default domain is adequate
      # for the hackathon demo. Configure a custom domain in the FC console if needed.

  # ── Agent HTTP service (Option A: cloud-to-cloud) ──
  # Deployed as a third FC function. The watcher POSTs disruption events here.
  # Bundled with pydantic (the one essential dep; httpx is lazy-imported).
  #
  agent:
    component: fc
    props:
      region: ${vars.region}
      service:
        name: tripcascade-agent
        description: TripCascade agent HTTP service (invoked by the watcher)
      function:
        name: agent
        runtime: python3.10
        handler: tripcascade.agent.http_service.fc_http_handler
        codeUri: ./
        memorySize: 512
        timeout: 60
        environmentVariables:
          TRIPCASCADE_LLM_BACKEND: "stub"
          SETTLEMENT_CAP_CENTS: "5000"
      triggers:
        - name: http-trigger
          type: http
          qualifier: LATEST
          config:
            methods: ["GET", "POST"]
            authType: anonymous