[project]
name = "tripcascade"
version = "0.1.0"
description = "Forecast-driven agentic trip re-planning with bounded autonomy (Alibaba Cloud x Atlas Agentic AI Hackathon)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "joblib>=1.5.3",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pydantic>=2.7",
    "scikit-learn>=1.9.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripcascade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
